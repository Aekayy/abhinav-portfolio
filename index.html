<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf4f4" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Abhinav Krishnan, Product Designer</title>
  <meta name="description"
    content="Abhinav is a UX/Product Designer currently open to full time opportunities in the US." />
  <meta name="author" content="Abhinav Krishnan" />
  <link rel="canonical" href="https://www.abhikrish.us/" />

  <!-- ── social preview ──────────────────────────────────────────
       Absolute URLs, and not a stylistic preference: a crawler fetches
       og:image from a server that has no idea which page the tag came from,
       so a relative path resolves against nothing and the card falls back to
       a bare link. Same for og:url.

       www, matching the link that actually gets posted. The host in these
       tags is the host the image is fetched from, so it has to be one that
       answers. Pointing at the apex while sharing the www link works only for
       as long as the apex also serves — one DNS change away from every
       preview on the internet going blank. This way the apex, if it is live,
       serves tags pointing at www, and both links preview identically.

       og:image:width and :height let X and LinkedIn reserve the 1.91:1 slot
       before the image itself arrives, which is the difference between a card
       that appears whole and one that reflows in the feed.

       OG uses property=, the twitter:* tags use name= — that asymmetry is in
       the specs, not a typo. LinkedIn, Slack, WhatsApp and iMessage read OG
       only; X reads twitter:* first and falls back to OG.

       One caveat worth knowing: this is a single page app, so every route
       shares these tags. A link to /projects/harmoney previews as the site,
       not as that case study. Per-project cards would need the routes
       prerendered at build time — say the word and that is the next step. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Abhinav Krishnan" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:url" content="https://www.abhikrish.us/" />
  <meta property="og:title" content="Abhinav Krishnan, Product Designer" />
  <meta property="og:description"
    content="Abhinav is a UX/Product Designer currently open to full time opportunities in the US." />
  <meta property="og:image" content="https://www.abhikrish.us/og.png" />
  <meta property="og:image:secure_url" content="https://www.abhikrish.us/og.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"
    content="Abhinav Krishnan — Product Designer and UI/UX Designer, Houston, TX" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@uhbeeenow" />
  <meta name="twitter:creator" content="@uhbeeenow" />
  <meta name="twitter:title" content="Abhinav Krishnan, Product Designer" />
  <meta name="twitter:description"
    content="Abhinav is a UX/Product Designer currently open to full time opportunities in the US." />
  <meta name="twitter:image" content="https://www.abhikrish.us/og.png" />
  <meta name="twitter:image:alt"
    content="Abhinav Krishnan — Product Designer and UI/UX Designer, Houston, TX" />

  <!-- Light is the default; a returning visitor who chose dark never sees a
         light flash first. -->
  <script>
    try {
      var t = localStorage.getItem('ak-theme') === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', t)
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#181818' : '#faf4f4')
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
