<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf4f4" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Abhinav Krishnan — UX / Product Designer</title>
  <meta name="description"
    content="Abhinav is a UX/Product Designer currently open to full time opportunities in the US." />

  <!-- Light is the default; a returning visitor who chose dark never sees a
         light flash first. -->
  <script>
    try {
      var t = localStorage.getItem('ak-theme') === 'dark' ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', t)
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#181818' : '#faf4f4')
    } catch (e) { }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
