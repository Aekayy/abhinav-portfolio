<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Abhinav Krishnan — UX / Product Designer</title>
    <meta name="description" content="Abhinav is a UX/Product Designer currently open to full time opportunities in the US." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Applied before the stylesheet so a returning visitor who chose dark
         never sees a white flash first. -->
    <script>
      try {
        if (localStorage.getItem('ak-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#181818')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
