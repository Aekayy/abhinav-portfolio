:"abhinavdesignerux@gmail.com",phone:"+1 (945) 249-6036",tagline:"A UX/Product Designer based in Houston, TX",intro:"I am a strategist, crafting experiences that connect deeply and spark creativity.",bio:"I specialise in UI/UX design, web and mobile interfaces, and brand identity. I turn complex ideas into intuitive, visually striking designs using Figma, pencil and Framer. Driven by research, clarity and attention to detail, I create interfaces that do not just look good, they work.",aboutQuote:"I’m a UX/Product Designer who builds with clarity and questions with intent. I stay current with design trends but focus on what truly improves the experience.",aboutBody:"I care about solving real world problems. From healthcare and enterprise products to B2B2C and SaaS, my work centres on reducing friction and designing systems that feel human.",philosophyTitle:"The Law of Circle",philosophy:["It means that no matter how far I go, I always return to the basics. In a field that constantly moves forward, I pause, reflect, and revisit the foundation: the users, the context, the core problem.","That loop keeps my work honest and focused. For me, design isn’t about chasing novelty. It’s about staying rooted while growing sharper."]},df=[{src:"img/about/portrait-1.jpg",alt:"Abhinav Krishnan"},{src:"img/about/portrait-2.jpg",alt:"Abhinav Krishnan at work"}],ff=[{src:"img/resume/resume-1.jpg",alt:"Resume, page one"},{src:"img/resume/resume-2.jpg",alt:"Resume, page two"}],Ku=[{label:"LinkedIn",href:"https://www.linkedin.com/in/abhinavux4/"},{label:"Medium",href:"https://medium.com/@abhinavkrish.ux"},{label:"Behance",href:"https://www.behance.net/abhinavkrish"}],Xu=[{no:"01",name:"Product Design"},{no:"02",name:"UI/UX Design"},{no:"03",name:"Web Design"},{no:"04",name:"Branding"}],Fo=[{value:"4+",label:"Years of professional UX experience"},{value:"20+",label:"Projects completed"},{value:"100+",label:"Product screens and flows designed"},{value:"50+",label:"Mentorships provided"},{                          text-(--ink) transition-colors hover:bg-(--surface) lg:hidden`,children:s.jsx("svg",{width:"16",height:"16",viewBox:"0 0 24 24","aria-hidden":"true",children:P?s.jsx("path",{d:"M5 5l14 14M19 5L5 19",stroke:"currentColor",strokeWidth:"1.8",strokeLinecap:"round"}):s.jsx("path",{d:"M3 7h18M3 12h18M3 17h18",stroke:"currentColor",strokeWidth:"1.8",strokeLinecap:"round"})})})]})]}),P&&s.jsx("div",{className:"mt-2 grid gap-1 rounded-(--radius-card) border border-(--line) bg-(--page) p-2 lg:hidden",children:Oo.map(([j,H])=>s.jsx("a",{href:`#${j}`,onClick:F=>{F.preventDefault(),dn(j)},"aria-current":u===j?"page":void 0,className:Vu("t-body rounded-(--radius-pill) px-4 py-3 transition-colors",u===j?"bg-(--surface) text-(--ink)":"text-(--ink-muted)"),children:H},j))})]})})}function yf(){return s.jsx("footer",{"data-no-reveal":!0,className:"mt-24 border-t border-(--line) bg-(--footer) py-14",children:s.jsxs("div",{className:"shell",children:[s.jsxs("div",{className:"flex flex-wrap justify-between gap-10",children:[s.jsxs("div",{className:"min-w-0 max-w-[36ch]",children:[s.jsx("div",{className:"t-sub text-(--ink)",children:ie.name}),s.jsxs("p",{className:"t-body-sm mt-3 text-(--ink-muted)",children:[ie.role," based in ",ie.location,". ","Open to full time roles in the US."]}),s.jsx("a",{href:`mailto:${ie.email}`,className:"t-body-sm mt-4 inline-block text-(--ink) underline underline-offset-4",children:ie.email})]}),s.jsxs("nav",{"aria-label":"Footer",className:"min-w-0",children:[s.jsx("div",{className:"t-caption mb-3 uppercase tracking-[0.14em] text-(--ink-muted)",children:"Pages"}),s.jsx("ul",{className:"grid gap-2",children:Oo.map(([u,y])=>s.jsx("li",{children:s.jsx("a",{href:`#${u}`,onClick:m=>{m.preventDefault(),dn(u)},className:"t-body-sm text-(--ink-muted) transition-colors hover:text-(--ink)",children:y})},u))})]}),s.jsxs("div",{className:"min-w-0",children:[s.jsx("div",{className:"t-caption mb-3 uppercase tracking-[0.14em] text-(--ink-muted)",children:"Elsewhere"}),s.jsx("ul",{className:"grid gap-2",children:Ku.map(u=>s.jsx("li",{children:s.jsxs("a",{href:u.href,target:"_blank",rel:"noreferrer noopener",className:"t-body-sm text-(--ink-muted) transition-colors hover:text-(--ink)",children:[u.label," ↗"]})},u.label))})]})]}),s.jsxs("div",{className:"mt-12 flex flex-wrap items-center justify-between gap-4 border-t border-(--line) pt-6",children:[s.jsx("span",{className:"t-caption text-(--ink-muted)",children:"Made with ☕ in hand"}),s.jsxs("span",{className:"t-caption text-(--ink-muted)",children:[new Date().getFullYear()," · ",ie.name]})]})]})})}const vf=[{id:"what",label:"The product",heading:"A physical card that carries your business",blocks:[{kind:"text",body:["Tap it to any phone and your Harmoney profile opens in the browser, ready to take a payment. Nothing to install, nothing to spell out, nothing to remember later."]},{kind:"figure",src:"img/harmoney/hero.jpg",caption:"The tapped profile and the seller’s home screen",ratio:"16/9"},{kind:"split",title:"",items:[{label:"01 · One tap, one profile",body:"The card touches a phone and a profile loads in under a second. Payment links, socials, booking and portfolio all sit one tap deep."},{label:"02 · Made for earning in person",body:"Built for vendors, creators and operators who meet people face to face and want the conversation and the payment to happen in the same moment."},{label:"03 · Simple on purpose",body:"Ten dollars once, no subscription and no terminal. The payer needs nothing but the phone already in their hand."}]}]},{id:"opportunity",label:"The opportunity",heading:"Intent is strongest the moment someone says yes",blocks:[{kind:"text",body:["When someone says yes in person, the intent to pay is at its strongest. Today that intent has to travel through several steps before money moves. Every step it survives is value kept, and that is where Harmoney does its work."]},{kind:"ladder",title:"How intent travels today · modelled with Tyi",steps:[{stage:"Meet",note:"Intent is at its peak",value:"100%"},{stage:"Exchange",note:"A card, handle or number is shared",value:"~60%"},{stage:"Remember",note:"Both people must recall later",value:"~30%"},{stage:"Follow up",note:"Someone has to send a link",value:"~15%"},{stage:"Pay",note:"Money moves. This is the moment we designed toward",value:"~8%"}]},{kind:"compare",title:"What already exists, and the space between",items:[{name:"Link in bio",good:"Holds identity beautifully",gap:"Sits one step away from the payment itself"},{name:"Card reader",good:"Takes payment reliably",gap:"Travels without the profile or the follow up"},{name:"P2P apps",good:"Move money instantly",gap:"Work best once two people already know each other"},{name:"Business card",good:"Opens the conversation",gap:"Carries the introduction, then hands off"}]}]},{id:"ninety-seconds",label:"The same ninety seconds, twice",heading:"Nothing goes wrong. The booking just evaporates",blocks:[{kind:"text",body:["Harmoney does not remove the payment step. The payer still opens their phone and authorises, and that step should take a deliberate action. What changes is everything that happens before it.","Danielle is a stylist in Brooklyn. Bookings run between ninety and four hundred dollars, and almost all of them start as a conversation somewhere that is not a shop. She has no counter, no card reader and nowhere to put a QR code. Her work is mobile, so her ability to get paid has to be mobile too.","Tonight is a friend’s rooftop birthday. She has just finished touching up her friend’s makeup before they head upstairs."]},{kind:"split",title:"The setup",items:[{label:"Where",body:"A rooftop party, not a shop."},{label:"At stake",body:"One booking, around $400."},{label:"On her",body:"A phone and her pocket."}]},{kind:"beats",title:"How it begins · identical either way",tone:"with",beats:[{at:"6:40 pm",said:"She has been watching for a while.",note:"A woman Danielle has never met has been watching her work."},{at:"6:41 pm",said:"Do you do this professionally? I am getting married in October.",note:"She leans over and asks the question that everything else follows from."}]},{kind:"beats",title:"Without Harmoney · four days, no booking",tone:"without",beats:[{at:"6:42 pm",said:"D · A · N · I · E · L · L · E dot…",note:"Danielle spells her handle. Three near identical accounts come up."},{at:"6:44 pm",said:"Sure, I will DM you tonight.",note:"Someone calls them over. The conversation ends there."},{at:"Four days later",said:"No reply",note:"Rates sent the next morning. Opened four days on, after two other artists replied."}],close:"Nothing went wrong. Nobody was rude. The booking quietly evaporated between “I will DM you” and Thursday."},{kind:"beats",title:"With Harmoney · under a minute, deposit taken",tone:"with",beats:[{at:"6:42 pm",said:"Her profile opens in a second.",note:"She takes the card from her pocket and holds it to the phone."},{at:"6:42 pm",said:"$150 to hold a date",note:"Recent work, her rates, and a deposit already filled in. Nothing to type."},{at:"6:43 pm",said:"+$150 received",note:"She scrolls for eight seconds, taps Pay, Face ID. Danielle’s phone buzzes."}],close:"The whole thing took less time than spelling her Instagram handle would have."},{kind:"split",title:"What actually changed",items:[{label:"Identical in both: the payment step",body:"Open the phone, authorise, done. That step should take a deliberate action, and Harmoney leaves it alone."},{label:"Everything ahead of it",body:"Spelling a handle out loud. Searching, and three similar accounts. “I will send you my rates.” Typing an amount, or guessing it. Four days for someone else to answer first."}]},{kind:"quote",body:"It does not make paying faster. It makes paying now possible, where the alternative was meaning to and not getting round to it."},{kind:"text",body:["At a shop counter with a queue, a customer has already decided to buy and a QR code is perfectly good. Harmoney earns its place where there is no counter and no decision yet."]}]},{id:"does",label:"What Harmoney does",heading:"Discovery, identity and payment in one gesture",blocks:[{kind:"split",title:"",items:[{label:"01 · Tap",body:"The card touches any phone. Nothing to install on their side."},{label:"02 · Open",body:"A profile loads in the browser in under a second."},{label:"03 · Pay",body:"Payment, booking, socials and portfolio, all one tap deep."}]},{kind:"quote",body:"The card is ten dollars, once. Revenue comes from payments that complete, not from subscription.",source:"The insight that shaped every screen"},{kind:"text",body:["Every screen between the tap and settled money carries the business, so those flows earned the deepest attention. Anything that could slow a payment down was treated as a design problem worth solving early."]}]},{id:"goals",label:"Project goals",heading:"Agreed before design started",blocks:[{kind:"text",body:["Agreed with Tyi before design started, and used to settle scope questions quickly later on."]},{kind:"split",title:"",items:[{label:"Convert the gesture",body:"Turn taps into completed payments, not just profile views."},{label:"Smooth the onboarding",body:"Four steps, one decision each, with the lasting step clearly flagged."},{label:"Make money legible",body:"Fees, timing and destination visible before every action."},{label:"Unify the brand",body:"One identity across marketing, product and the physical card."}]}]},{id:"who",label:"Who it is for",heading:"Three earner types, plus the person nobody designs for",blocks:[{kind:"text",body:["Built from the founder’s market knowledge and the presale audience, and labelled proto personas because at this stage they are informed models, not validated research."]},{kind:"table",columns:["Persona","Who they are","Ticket","In their words"],rows:[["The Vendor, Maya Ortiz","Ceramics at weekend markets. Twelve to twenty sales a day, hands full.","$20 to $60","If it takes longer than handing over change, I have lost the next customer."],["The Service Creator · Danielle Reid","Studio sessions and styling. Sells credibility before she sells time.","$90 to $400","By the time I send the link, the excitement has gone."],["The Operator · Marcus Bell","Runs a five person event team. Answers to a bank account, not a feeling.","Mixed","I do not need a dashboard. I need to find the one payment that needs me."],["The Payer · Alex Nguyen","Never heard of Harmoney. Two seconds, and a stranger holding out a card.","n/a","I have no idea what this is. Why would I put my card details in?"]]}]},{id:"journey",label:"User journey map",heading:"Three of the six stages exist only because payment happens later",blocks:[{kind:"text",body:["The Service Creator, current state against designed state. I mapped all three earner types, and this is the one that offered the most to design for."]},{kind:"table",columns:["Stage","Today","Designed for"],rows:[["Meet","Intent is at its highest","Tap replaces the exchange"],["Exchange","Interest lives only in memory","Profile opens with proof of work"],["Recall","Recall does the work","Nothing to recall, payment is now"],["Follow up","Following up sits with her","Follow up unnecessary"],["Pay","The wait is quiet","Payer sees amount and pays in place"],["Settle","Timing is unclear","Timeline and payout date up front"]]},{kind:"quote",body:"Bring the payment into the moment and three of those stages simply fall away.",source:"The insight that reordered the roadmap"},{kind:"text",body:["That is why the tap and the public profile came first. The dashboard is where the seller lives, and the profile is where the payment is decided."]}]},{id:"stories",label:"User stories",heading:"Requirements that never left their reason behind",blocks:[{kind:"text",body:["Written as acceptance criteria I could design against and a developer could build against, but held to a person so the requirement never got separated from its reason."]},{kind:"list",title:"Maya, the Vendor · P0",items:["Take payment without touching a keyboard, so I do not slow the queue.","Show the payer an amount already filled in, so nothing is left to decide.","Confirm a payment landed without opening the app."]},{kind:"list",title:"Danielle, the Service Creator · P0",items:["Show real work before money is mentioned, so a stranger takes me seriously.","Send a set amount rather than a generic link, so I am not negotiating after.","Stop chasing invoices, because chasing makes me look like I need it."]},{kind:"list",title:"Marcus, the Operator · P0",items:["See gross, fee and net before I confirm, so I am never surprised after.","Find any payment that needs attention without scrolling, so I can sort it the same day.","Know the date money lands, not just that it is on the way."]},{kind:"list",title:"Alex, the Payer · P0",items:["Know who I am paying and what for, before I am asked for anything.","Pay without downloading an app or creating an account.","Get a receipt that proves it happened."]},{kind:"quote",body:"Three of these people are customers. The fourth is meeting Harmoney for the first time, and everything depends on those few seconds.",source:"The fourth user"},{kind:"text",body:["Every requirement Alex has sits on the public profile, a screen the account holder rarely sees. That is why it was designed first, ahead of the dashboard where the paying customer spends their time."]}]},{id:"principles",label:"Principles",heading:"Five, agreed before a single screen was drawn",blocks:[{kind:"principles",items:[{no:"01",name:"Protect the gesture",body:"Nothing may add a step between the tap and the profile loading."},{no:"02",name:"Money is never a surprise",body:"Fees, timing and destination before the action, never after."},{no:"03",name:"Density where it earns it",body:"A ledger is for scanning. Space is spent on numbers and states."},{no:"04",name:"Every state is considered",body:"Empty, loading and offline states are where trust is built."},{no:"05",name:"One identity, end to end",body:"Site, app and card match. Discontinuity reads as risk."}]}]},{id:"ideation",label:"Ideation",heading:"Three structural concepts, one story",blocks:[{kind:"text",body:["Three structural concepts before any pixel was styled, run against the same story: take payment from a stranger in under ten seconds."]},{kind:"compare",title:"",items:[{name:"Wallet first · explored",good:"Familiar to anyone who has used a banking app.",gap:"Asks the seller to navigate before they can earn, which suits checking more than selling."},{name:"Terminal first · explored",good:"Fastest possible path to a charge.",gap:"Leads with an amount, where the service creator benefits from showing credibility first."},{name:"Profile first · chosen",good:"Matches where money is actually decided.",gap:"Asks the seller dashboard to sit second, which took some getting used to."}]},{kind:"quote",body:"The seller already believes in it. The payer is deciding in the moment. Design effort goes furthest where the decision is still open."}]},{id:"wireframes",label:"Wireframes and lo-fi",heading:"If a screen does not work in grey, colour will not save it",blocks:[{kind:"text",body:["Structure and hierarchy resolved in greyscale, with the reasoning annotated on the artefact so it survived review without me in the room. Layout and density were then resolved at full detail with colour still withheld."]},{kind:"figure",src:"img/harmoney/wireframes.jpg",caption:"Home, ledger, request, links and the public profile, annotated",ratio:"16/9"},{kind:"split",title:"Two things greyscale surfaced",items:[{label:"It clarified the ledger row",body:"The name and the amount were carrying equal weight. Seeing it in grey made the fix obvious, and it held once colour arrived."},{label:"It simplified the home screen",body:"Without colour to separate them, four primary actions read as one. We reduced it to three."}]},{kind:"list",title:"Reasoning annotated on the artefact",items:["Creating a link is the primary job, so it sits above the list rather than behind a plus icon.","Conversion data lives on the row, because a link without performance data is unactionable.","Card analytics live with the card, not in a separate insights tab. The object and its performance belong together.","The public profile is seen by a stranger. It is the only screen that must convert with zero prior context.","Freeze is destructive, so it is isolated and colour coded, and it is reversible, so the copy says so."]}]},{id:"visual",label:"Visual direction",heading:"Colour applied last, on structure already settled",blocks:[{kind:"text",body:["Deep green carries navigation, the card and identity. Lime is held back for the single highest intent action on any screen."]},{kind:"table",title:"Palette",columns:["Role","Value"],rows:[["Deep green","#2D4A1E"],["Green","#4A7A28"],["Lime","#8DC63F"],["Sage","#E8F2D8"],["Paper","#F7F5EC"],["Ink","#16260F"]]},{kind:"split",title:"Type",items:[{label:"Bebas Neue",body:"Display and brand moments."},{label:"Archivo",body:"Interface and prose."},{label:"Inconsolata",body:"Tabular figures for money, so decimals align and amounts do not shift width."}]},{kind:"figure",src:"img/harmoney/product.jpg",caption:"Forty six screens across two themes",ratio:"16/9"},{kind:"text",body:["Both themes are built as a structural property rather than a separate skin, so they come out of the same components."]}]},{id:"decisions",label:"Decisions",heading:"Four choices, and what each one traded",blocks:[{kind:"split",title:"",items:[{label:"Showing fees before the confirm",body:"In a product that grows on repeat volume, a creator who understands the fee on their first payment is far more likely to come back for the second. Gross, fee and net appear before every action. The tradeoff: a moment of extra reading in exchange for long term confidence."},{label:"Designing the empty state first",body:"Every seller starts at zero, so the empty screen is the one they see most in week one. It confirms the card is live, explains what happens next, and offers a way to share the profile. The tradeoff: the most common early state earned real attention."},{label:"Leading with reassurance",body:"When a balance will not load, the most useful thing an app can say is that the money is safe. Offline opens with that, shows the last known figure, and mentions connectivity second. The tradeoff: calm first, detail second."},{label:"Placing friction where it helps",body:"Claiming a permanent address is the one onboarding step that stays with you. It gets its own screen, a clear note, and a confirmation naming the exact value being set. The tradeoff: a small pause here saves a conversation later."}]}]},{id:"states",label:"Every state is designed",heading:"The quiet states are where trust is built",blocks:[{kind:"split",title:"",items:[{label:"Empty",body:"Confirms the card is live. “Your card is active and ready. The first person who taps it will show up right here.”"},{label:"Offline",body:"Reassurance first. “Your money is safe. This is a connection problem, not an account problem.” Last synced balance shown."},{label:"In progress",body:"The tap as an event. Ready to tap, hold your card near their phone, amount and item named."},{label:"Success",body:"A fee breakdown, not just a tick. Gross, processing fee, net to you, and the date it becomes available."}]}]},{id:"accessibility",label:"Accessibility",heading:"Considered during design, not audited afterwards",blocks:[{kind:"text",body:["Where it is not resolved, I have said so."]},{kind:"table",columns:["Item","Status","Detail"],rows:[["Never colour alone","Resolved","Status carries colour, background and a word. Direction carries colour, an arrow and a sign. Verified by designing the whole product in grey first."],["44pt tap floor","Resolved","Anything visually smaller sits inside a larger pressable row that carries the target."],["Tabular figures","Resolved","Money uses a monospaced face so decimals align and amounts do not shift width as digits change."],["Contrast on the brightest accent","In review","The brightest brand green on white sits close to the AA threshold for normal text. Documented with two remedies so the team can pick the right one."],["Dynamic Type","Open","Built on a fixed scale. Behaviour at the largest accessibility sizes is the next thing to test, starting with the ledger row."],["Screen reader semantics","Open","A transaction row should announce as one clear statement. Specified in handoff and ready to validate on device."]]}]},{id:"handover",label:"Production readiness",heading:"Finished when a team can build it without asking what I meant",blocks:[{kind:"split",title:"",items:[{label:"A system, not a file",body:"Colour, type, spacing and elevation defined as named roles, so a theme change is a systems change rather than a screen by screen edit."},{label:"Documented components",body:"Each carries its variants, content rules and construction reasoning, so intent survives after I leave."},{label:"Handed over as code",body:"Tokens exported in a format engineering consumes directly, with written guidance on device targets and theming behaviour."},{label:"Reviewed for consistency",body:"Structural checks across the full screen set for spacing, layout behaviour and consistent styling, so the file holds together as it grows."}]}]},{id:"measures",label:"How I would know it worked",heading:"Measures agreed, and the signals to look again",blocks:[{kind:"text",body:["The product had not launched at handover, so these are the measures Tyi and I agreed on, along with the signals that would tell us to look again."]},{kind:"table",columns:["Goal","Measure","What we would watch for"],rows:[["The gesture converts","Taps that end in a completed payment","Taps growing faster than payments"],["Sellers trust settlement","Withdrawal completion rate","Hesitation at the fee breakdown"],["Onboarding holds","Step level completion","A dip at the handle or bank step"],["The ledger is usable","Time to find a specific transaction","Little benefit at low volume"],["The card earns its place","Repeat taps per active seller","Taps not repeating month to month"]]}]},{id:"reflection",label:"Reflection",heading:"What I took from it",blocks:[{kind:"split",title:"",items:[{label:"The brief opened up into something bigger",body:"The starting point was a set of screens. Working through it with Tyi, it became clear the more useful contribution was defining what the product was for, who it served, and which moments carried the business. He gave me the room to go there."},{label:"Holding colour back paid off",body:"Working in greyscale through wireframes and lo-fi meant every hierarchy question was answered with structure. Two things surfaced there that would have been easy to miss later."},{label:"What I would add next",body:"Not more screens. Five conversations with working vendors would test three of the assumptions this work is built on, and I designed those parts to be easy to change for exactly that reason."}]},{kind:"quote",body:"The card that makes you money.",source:"Product design by Abhinav Krishnan for Tyi Moncrieffe, Anthem Nation · New York"}]}],Zu=[{slug:"harmoney",name:"Harmoney",title:"Turns a handshake into a payment, so people who earn in person can get paid in the moment.",summary:"A tap to pay NFC card and companion app for vendors, creators and operators. Designed end to end with Anthem Nation, from first principles to a production ready product.",year:"2026",industry:"Fintech · Payments",role:"Product Designer",client:"Anthem Nation, with Tyi Moncrieffe",kind:"project",accent:"#1f6f4a",duration:"Dec 2025, Jun 2026",sections:vf},{slug:"vesseli",name:"Vesseli",title:"A seamless maritime hiring experience for boat owners and crew",summary:"A mobile platform helping boat owners hire crew and coordinate maritime work. I worked directly with the CEO to redesign the existing app and improve its usability, structure and overall experience.",year:"2025",industry:"Maritime · B2B2C",role:"Product, UX/UI Designer",client:"Vesseli, UK, with Laurence McRory",duration:"3 months",kind:"project",accent:"#2b6c8f",sections:[{id:"background",label:"Background",heading:"A clear vision without the structure to carry it",blocks:[{kind:"text",body:["Vesseli is a maritime platform designed to help boat owners hire crew, coordinate vessel deliveries and manage short-term maritime work. I collaborated directly with the CEO, Laurence McRory, after reaching out to him when he was looking for design support to improve the existing app.","The original product had a clear vision but lacked usability, structure and engagement. The goal of this redesign was to turn Vesseli into a platform that users not only understand but actually enjoy using."]},{kind:"list",title:"The opportunity is significant",items:["The global maritime industry is worth hundreds of billions.","Demand for flexible, short-term crew hiring is increasing.","There is a lack of modern, user-friendly digital solutions."]}]},{id:"problem",label:"The problem",heading:"Users struggled to complete key actions",blocks:[{kind:"list",title:"The existing app suffered from",items:["Unclear navigation and user flows.","Lack of visual hierarchy and consistency.","Low perceived trust due to unstructured profiles.","Minimal engagement from a purely functional interface."]},{kind:"list",title:"As a result",items:["Users struggled to complete key actions.","Hiring decisions lacked confidence.","The app did not reflect its true potential."]}]},{id:"goals",label:"Goals",heading:"What the redesign had to achieve",blocks:[{kind:"list",items:["Redesign the app to improve usability and clarity.","Introduce a strong, cohesive visual identity.","Simplify hiring and coordination workflows.","Build trust through structured information.","Create a scalable foundation for future development."]},{kind:"split",title:"Prioritising the problem",items:[{label:"Core hiring flow",body:"Ensuring users can discover, evaluate and hire efficiently."},{label:"Onboarding and role clarity",body:"Defining user intent early to reduce confusion."},{label:"Trust and profile structure",body:"Making it easier to assess credibility."},{label:"Navigation simplicity",body:"Reducing friction across key journeys."}]}]},{id:"research",label:"Research",heading:"Trust is what people are actually judging",blocks:[{kind:"list",title:"Approach",items:["Discussions with the founder.","Analysis of the existing product experience.","Competitive review of maritime and gig platforms."]},{kind:"list",title:"Key insights",items:["Users rely heavily on trust and reputation.","Lack of structure leads to hesitation in hiring.","Simplicity directly impacts action-taking.","Visual design influences perceived credibility."]},{kind:"quote",body:"It’s useful, but I’m not always sure who to trust or how to choose the right person.",source:"Usability test, SeaPeople, a competing maritime hiring platform"},{kind:"text",body:["Testing revealed that while the platform enables hiring, it lacks clear trust indicators and structured profiles. Users struggle to confidently evaluate crew members, which slows decisions. The absence of strong visual hierarchy and credibility signals increases cognitive load and reduces engagement."]}]},{id:"users",label:"Users",heading:"Four segments, one primary persona",blocks:[{kind:"split",title:"User segments",items:[{label:"Boat owners",body:"Hire crew and manage operations."},{label:"Crew members",body:"Find jobs and build reputation."},{label:"Delivery skippers",body:"Manage vessel transport."},{label:"Service providers",body:"Offer specialised services."}]},{kind:"list",title:"Boat owner, primary persona",items:["Goals: find reliable crew quickly, evaluate credibility with confidence, manage hiring without friction.","Pain points: lack of trustworthy information, time-consuming communication, unclear hiring processes.","Needs: clear profiles, a simple hiring flow, strong trust indicators."]}]},{id:"solution",label:"Solution",heading:"Four moves",blocks:[{kind:"split",title:"",items:[{label:"Role-based experience",body:"Structured onboarding defines user intent early and personalises the experience."},{label:"Trust-driven profiles",body:"Profiles redesigned around experience, credentials, availability and a clear hierarchy of information."},{label:"Simplified hiring flow",body:"Reduced complexity in searching, evaluating, requesting and confirming jobs."},{label:"Visual identity revamp",body:"A beachy, harbour-inspired theme that reflects the maritime context and creates a calmer, more engaging experience."}]},{kind:"list",title:"Key design improvements",items:["Clear onboarding flow with role selection.","Improved card-based layouts for profiles.","Stronger CTA visibility.","Better spacing and readability.","A consistent design system."]}]},{id:"conclusion",label:"Outcome",heading:"From functional to trusted",blocks:[{kind:"text",body:["This redesign transformed Vesseli from a functional but underwhelming product into a structured, engaging platform with clear usability and a strong visual identity.","The new experience improves clarity across key workflows, builds trust through structured information, and lays a foundation for future scalability. The redesigned app is currently under development and represents the next evolution of the platform."]}]}]},{slug:"forecash",name:"ForeCash",title:"Helps users forecast savings, plan finances, and track transactions with AI insights.",summary:"Turning complex cash flow data into actionable insight, so people can make confident financial decisions without spreadsheets or guesswork.",year:"2025",industry:"Fintech · AI wealth management",role:"Product Designer",client:"Self-initiated concept",duration:"4 months",kind:"project",accent:"#8a5a2b",sections:[{id:"background",label:"Background",heading:"Most finance apps show you the past",blocks:[{kind:"list",title:"I noticed that most finance apps either",items:["Focus heavily on charts and numbers.","Surface problems without guidance.","Assume high financial literacy."]},{kind:"quote",body:"How might we help people feel more in control of their money without overwhelming them?"}]},{id:"problem",label:"The problem",heading:"People know what they earn. They struggle to save on purpose",blocks:[{kind:"text",body:["Traditional budgeting tools focus on tracking spending but fail to guide users with purpose or help them stay motivated.","People know what they earn and what they spend, but they struggle with saving intentionally or working toward meaningful milestones like starting a business, paying off student debt, or travelling the world."]}]},{id:"goals",label:"Goals",heading:"What the work had to move",blocks:[{kind:"list",items:["Increase user engagement and retention.","Reduce drop-offs during onboarding.","Raise goal completion rates.","Strengthen organic growth through clear value communication across web and app."]},{kind:"text",body:["I focused on the highest-friction moment in the journey: interpreting forecasts and acting on them. That was validated through user interviews, session recordings and funnel drop-off analysis."]},{kind:"split",title:"Trade-offs I accepted",items:[{label:"Less data upfront",body:"Reduced visual density to improve clarity, at the cost of showing less at a glance."},{label:"Progressive disclosure over shortcuts",body:"Prioritised a guided path over power-user shortcuts."}]}]},{id:"research",label:"Research",heading:"People want a partner, not a ledger",blocks:[{kind:"text",body:["I analysed financial discussions across communities where people expressed frustration with tools that only track historical spending without helping them anticipate or plan ahead.","Affinity mapping organised those insights into clear themes, revealing financial needs, behaviours and decision-making triggers, which then shaped the customer journey map."]},{kind:"quote",body:"I tried asking the AI about my financial goals in my own words, but it only offered a few preset questions to choose from. When I typed anything outside those options, it could not give me an answer.",source:"Usability test #1, Erica AI, Bank of America"},{kind:"quote",body:"The AI responds in a friendly and engaging way, but it cannot give me a personalised forecast or plan based on my specific situation. It feels like I am getting generic advice instead of something tailored to me.",source:"Usability test #2, Cleo AI"},{kind:"text",body:["Together those tests set the bar: financial wellness tools have to accept a question in the user’s own words, and answer it with something specific to them."]}]},{id:"users",label:"Users",heading:"Young professionals with irregular income",blocks:[{kind:"list",title:"Primary audience",items:["Young professionals (22 to 35) juggling irregular income.","People who don’t want strict budgets but want clarity and control.","Goal-oriented individuals saving for milestones: debt repayment, travel, business, investments."]},{kind:"list",title:"User needs",items:["Quick understanding of future cash flow.","Simple visuals that don’t require financial expertise.","Personalised advice and next-step suggestions."]}]},{id:"solution",label:"Solution",heading:"Guidance instead of raw numbers",blocks:[{kind:"split",title:"Core design decisions",items:[{label:"Progressive disclosure",body:"Users see summaries first, details on demand."},{label:"Scenario comparison",body:"Side-by-side layouts reduce memory load."},{label:"Explainability",body:"AI-generated insights explain why a forecast changed."}]},{kind:"text",body:["Instead of overwhelming users with raw numbers, the design guides them toward actionable understanding. I focused more on flows, assumptions and reasoning than on visual polish, mirroring real-world product problem solving.","The build covers two onboarding directions, a clean authentic version and an illustrated one, plus authentication, dashboard, goals and transactions, profile, security and analytics, and a conversational AI layer that offers suggestions, reminders and nudges."]}]},{id:"conclusion",label:"Outcome",heading:"From tracker to adaptive partner",blocks:[{kind:"text",body:["Feedback from usability testing shaped the final iteration of ForeCash into a platform that not only forecasts savings but actively motivates users to achieve their biggest financial goals."]}]}]},{slug:"merkle",name:"Merkle",title:"Enterprise Campaign Orchestrator",summary:"A unified enterprise platform that lets marketing teams plan, launch, monitor and optimise omnichannel campaigns from a single workspace.",year:"2025",industry:"Enterprise SaaS",role:"Product Designer",client:"Merkle",duration:"Jul 2024, Aug 2025",kind:"project",accent:"#4a4a86",sections:[{id:"overview",label:"Overview",heading:"A single workspace for omnichannel campaigns",blocks:[{kind:"text",body:["Led end to end UX for an enterprise marketing platform, improving campaign workflows through research, prototyping and usability testing with more than 150 users, driving a 22% increase in engagement.","Collaborated across product, business and engineering to design scalable Figma systems and reusable patterns that simplified complex workflows and improved usability and consistency."]},{kind:"list",title:"What this section still needs",items:["The full study on the existing site is password protected, so the detail is not reproduced here yet.","Once the content is to hand this page takes the same shape as the three studies beside it: problem, goals, research, users, solution, outcome."]}]}]},{slug:"spotify-alter",name:"Spotify Alter",title:"Change the sound, not the record",summary:"A concept feature letting listeners change the pitch, speed and tone of a track and keep that version, settings, not a copy, so the artist keeps the stream and the royalty. Designed and built end to end, including a working audio engine.",year:"2026",industry:"Concept · Consumer audio",role:"Product Designer, and build",client:"Self-directed",kind:"project",accent:"#1db954",external:{href:"https://spotify-alter.vercel.app/",label:"Open the live build",note:"Its own repository and deployment, linked rather than folded in."},sections:[{id:"problem",label:"The problem",heading:"People already alter music. Somewhere else",blocks:[{kind:"list",items:["Sped up and slowed versions pull enormous numbers on video platforms. The demand is settled.","Every one of them is a re-upload, which pays whoever uploaded it rather than the artist who made it.","Spotify already has the tools: an equaliser exists in settings. It is buried, global, and cannot be saved per song."]},{kind:"text",body:["The demand is proven. The plumbing is what was missing."]}]},{id:"constraint",label:"The constraint",heading:"A version is settings, not audio",blocks:[{kind:"text",body:["The whole idea rests on one decision: a saved version stores about forty bytes of settings, not a copy of the recording. Playback changes on the listener’s device and the master is untouched.","That is what makes it something a rights holder could say yes to. There is no new copy to license, no re-upload to police, and the stream still counts for the artist who made it."]}]},{id:"engine",label:"The build",heading:"Pitch and speed had to move independently",blocks:[{kind:"text",body:["A concept that claims a listener can slow a track without dropping its key has to prove it, so I built the audio engine rather than faking it with a demo video.","It uses WSOLA time-stretching with a separate resampling stage, the same decomposition BASS_FX exposes as two independent attributes. Moving one control cannot move the other, verified offline to within fourteen cents of pitch and 0.4% of duration across eight combinations."]},{kind:"split",title:"Two problems worth naming",items:[{label:"It sounded broken pushed up, muffled pulled down",body:"Both came from reading the buffer with a straight line between samples. Linear interpolation dulls the top end going down and aliases going up. A cubic read plus a guard filter took folded energy from 54% of the reference to 6%."},{label:"It played nothing at all once deployed",body:"The worklet was assembled by stringifying a class. At the production build target that class references a helper the worklet scope cannot see, so it died silently. It is a properly bundled module now, with a test that runs the shipped file."}]}]},{id:"outcome",label:"Outcome",heading:"A working thing, not a mockup",blocks:[{kind:"text",body:["The result is a live site with eight cleared sample tracks and the option to load your own file, a full case study covering the process, and mobile and desktop mockups of the feature inside Spotify’s own design language."]}]}]}],wf=Zu,kf=u=>Zu.find(y=>y.slug===u);function Le({children:u}){return s.jsx("p",{className:"t-caption mb-4 uppercase tracking-[0.16em] text-(--ink-muted)",children:u})}function jr({eyebrow:u,title:y,lede:m}){return s.jsxs("header",{className:"pt-16 md:pt-24",children:[s.jsx(Le,{children:u}),s.jsx("h1",{className:"t-display max-w-[20ch] text-(--ink)",children:y}),m&&s.jsx("p",{className:"t-body mt-6 max-w-[58ch] text-(--ink-muted)",children:m})]})}function _e({children:u,className:y=""}){return s.jsx("section",{className:`py-14 md:py-20 ${y}`,children:s.jsx("div",{className:"shell",children:u})})}function Nr({to:u,children:y,className:m=""}){return s.jsx("a",{href:`#${u}`,onClick:P=>{P.preventDefault(),dn(u)},className:m,children:y})}function xf({projects:u}){const y=We.useRef(null),m=P=>{const R=y.current;if(!R)return;const M=R.querySelector("[data-card]"),j=M?M.offsetWidth+24:R.clientWidth*.5;R.scrollBy({left:j*P,behavior:"smooth"})};return s.jsxs("div",{className:"relative",children:[s.jsx("div",{className:"shell mb-5 flex justify-end gap-2",children:[["-1","Previous"],["1","Next"]].map(([P,R])=>s.jsx("button",{onClick:()=>m(Number(P)),"aria-label":`${R} projects`,className:`grid h-10 w-10 pl
